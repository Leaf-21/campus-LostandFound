# 校园失物招领平台 — 生产部署编排
# 用法见 docs/14_部署与交付说明.md
#
#   cp .env.docker.example .env.docker   # 填写真实密钥
#   docker compose --env-file .env.docker up -d --build
#
# 首次启动后需执行迁移与 Seed（见 docs/14 §3）

services:
  mysql:
    image: mysql:8.4
    container_name: lf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.docker 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_lost_found}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 数据库不对外暴露端口，仅容器网络内可见（docs/10 §6）
    expose:
      - '3306'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-campus_lost_found}
      JWT_SECRET: ${JWT_SECRET:?请在 .env.docker 中设置}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env.docker 中设置}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?请在 .env.docker 中设置}
      TZ: Asia/Shanghai
    volumes:
      # 上传文件持久化（docs/10 §5）
      - uploads:/app/uploads
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql-data:
  uploads:
